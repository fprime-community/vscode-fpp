name: IntelliJ Plugin

on:
  push:
    branches: [ main ]
    paths:
      - "editors/intellij/**"
      - "editors/code/syntax/**"
      - ".github/workflows/intellij.yml"
  pull_request:
    paths:
      - "editors/intellij/**"
      - "editors/code/syntax/**"
      - ".github/workflows/intellij.yml"
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: intellij-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: editors/intellij

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Free GitHub Actions Environment Disk Space (downloading the IDE platform
      # requires a fair amount of space).
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      # Manage caching ourselves so the (large) downloaded IntelliJ Platform IDE
      # persists across runs. The IDE is downloaded into ~/.gradle/caches. The
      # restore-keys fall back to the newest previous cache, so bumping
      # `platformVersion` reuses everything else and only re-downloads the IDE.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      - name: Cache Gradle & IntelliJ Platform
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('editors/intellij/**/*.gradle.kts', 'editors/intellij/gradle.properties', 'editors/intellij/gradle/libs.versions.toml', 'editors/intellij/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # On a release, derive the plugin version from the tag (strips a leading
      # "v"). Gradle picks this up as the `pluginVersion` project property via
      # the ORG_GRADLE_PROJECT_ convention, overriding gradle.properties.
      - name: Set plugin version from release tag
        if: github.event_name == 'release'
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          echo "ORG_GRADLE_PROJECT_pluginVersion=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Run tests
        run: ./gradlew check

      - name: Collect test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: intellij-tests-result
          path: editors/intellij/build/reports/tests

      # GitHub Actions always re-zips uploaded artifacts, so uploading the
      # distribution .zip directly produces a double-zipped download that the
      # JetBrains Marketplace rejects ("archive contains an unexpected file
      # '<plugin>.zip'"). Upload the *extracted* plugin directory instead so the
      # downloaded artifact is a valid, directly-uploadable plugin archive whose
      # root is the plugin directory (containing `lib/`).
      - name: Stage plugin for a directly-uploadable artifact
        run: |
          rm -rf build/plugin-artifact
          mkdir -p build/plugin-artifact
          zip=$(ls build/distributions/*.zip)
          unzip -q "$zip" -d build/plugin-artifact

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin
          path: editors/intellij/build/plugin-artifact

      # Attach the (single-zipped) plugin archive to the GitHub release. Release
      # assets are stored as-is, so this file can be uploaded straight to the
      # JetBrains Marketplace without unzipping.
      - name: Attach plugin to GitHub release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/*.zip --clobber
