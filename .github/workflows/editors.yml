name: Editor Plugins (Neovim & Emacs)

on:
  push:
    branches: [ main ]
    paths:
      - "editors/nvim/**"
      - "editors/emacs/**"
      - ".github/workflows/editors.yml"
  pull_request:
    paths:
      - "editors/nvim/**"
      - "editors/emacs/**"
      - ".github/workflows/editors.yml"
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: editors-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lint + behavioral (Tier 1) tests for the Neovim plugin. busted runs under
  # Neovim (via nlua) so specs can use the `vim` API without spawning the server.
  neovim:
    name: Neovim
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/nvim
    strategy:
      fail-fast: false
      matrix:
        neovim_version: [ 'stable', 'nightly' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - name: Install Lua tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          # nlua runs busted specs under Neovim so the `vim` API is available.
          sudo luarocks install nlua
          sudo luarocks install busted
          sudo luarocks install luacheck

      - name: Lint (luacheck)
        run: luacheck lua spec

      - name: Run tests (busted under nlua)
        run: busted

  # Byte-compile + ERT tests for the Emacs plugin.
  emacs:
    name: Emacs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/emacs
    strategy:
      fail-fast: false
      matrix:
        emacs_version: [ '29.1', 'release-snapshot' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Byte-compile
        run: emacs --batch -L . -f batch-byte-compile fpp-mode.el

      - name: Run ERT tests
        run: emacs --batch -L . -l test/fpp-mode-test.el -f ert-run-tests-batch-and-exit

  # Package the plugins as GitHub release assets. Only runs when a release is
  # published; mirrors how the VSCode/IntelliJ workflows attach their artifacts.
  release:
    name: Attach release tarballs
    if: github.event_name == 'release'
    needs: [ neovim, emacs ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Package plugins
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # Ship only what users need — exclude test/CI scaffolding.
          tar -czf "fpp-nvim-${TAG}.tar.gz" -C editors \
            --exclude='nvim/spec' --exclude='nvim/.busted' --exclude='nvim/.luacheckrc' \
            nvim
          tar -czf "fpp-emacs-${TAG}.tar.gz" -C editors \
            --exclude='emacs/test' --exclude='emacs/*.elc' \
            emacs

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" \
            "fpp-nvim-${TAG}.tar.gz" \
            "fpp-emacs-${TAG}.tar.gz" \
            --clobber
