name: Pip Packages

# Builds pip wheels + sdists for the FPP Rust executables:
#   - fprime-fpp-lsp     (from fpp_lsp_server)
#   - fprime-fpp-format  (from fpp_format)
#
# NOTE: This workflow only *builds* the distributions and uploads them as
# artifacts. It intentionally does NOT publish to PyPI yet.

on:
  push:
    branches: [ main ]
    paths:
      - "fpp_lsp_server/**"
      - "fpp_format/**"
      - ".github/workflows/pip.yml"
  pull_request:
    paths:
      - "fpp_lsp_server/**"
      - "fpp_format/**"
      - ".github/workflows/pip.yml"
  workflow_dispatch:

concurrency:
  group: pip-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheel ${{ matrix.package.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        package:
          - name: fprime-fpp-lsp
            dir: fpp_lsp_server
          - name: fprime-fpp-format
            dir: fpp_format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          working-directory: ${{ matrix.package.dir }}
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package.name }}-${{ matrix.os }}
          path: ${{ matrix.package.dir }}/dist/*

  sdist:
    name: sdist ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: fprime-fpp-lsp
            dir: fpp_lsp_server
          - name: fprime-fpp-format
            dir: fpp_format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: ${{ matrix.package.dir }}

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist-${{ matrix.package.name }}
          path: ${{ matrix.package.dir }}/dist/*
