name: VSCode Extension

on:
  push:
    branches: [ main ]
    paths:
      - "editors/code/**"
      - ".github/workflows/vscode.yml"
  pull_request:
    paths:
      - "editors/code/**"
      - ".github/workflows/vscode.yml"
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: vscode-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: editors/code

jobs:
  # Build, typecheck, bundle and run smoke tests. Also produces the .vsix
  # artifact used for manual verification and for the release job.
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: editors/code/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn compile

      - name: Bundle (production)
        run: yarn package

      - name: Run Tests
        run: yarn test
        
      - name: Package VSIX
        run: yarn vsix --out fpp.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: editors/code/fpp.vsix

  # Publish to the VS Code Marketplace. Only runs when a GitHub release is
  # published; the version is derived automatically from the release tag.
  publish:
    name: Publish to Marketplace
    if: github.event_name == 'release'
    needs: [ build-test ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: editors/code/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Derive the extension version from the release tag and mirror the
      # GitHub "pre-release" flag onto the Marketplace publish. The VS Code
      # Marketplace only accepts clean major.minor.patch versions, so reject
      # tags carrying a pre-release suffix (use the GitHub pre-release flag
      # instead).
      - name: Resolve version and pre-release flag
        id: rel
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          SEMVER="${VERSION#v}"
          if [[ "$SEMVER" == *-* ]]; then
            echo "::error::VS Code versions must be clean semver (major.minor.patch) without a pre-release suffix. Mark the GitHub release as a pre-release instead. Got: $SEMVER"
            exit 1
          fi
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            echo "prerelease_flag=--pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease_flag=" >> "$GITHUB_OUTPUT"
          fi
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Set version
        run: |
          echo "Setting extension version to ${{ steps.rel.outputs.semver }}"
          npm version "${{ steps.rel.outputs.semver }}" --no-git-tag-version --allow-same-version

      - name: Package VSIX
        run: yarn vsix --out fpp.vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath fpp.vsix --pat "$VSCE_PAT" ${{ steps.rel.outputs.prerelease_flag }}

      - name: Attach VSIX to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # This job's working-directory is editors/code (see defaults above), and
        # the VSIX is written there, so reference it relative to that dir.
        run: gh release upload "${{ github.event.release.tag_name }}" fpp.vsix --clobber
